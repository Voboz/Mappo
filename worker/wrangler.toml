# Configurazione per il deploy da riga di comando (wrangler).
# Dalla cartella worker/:  npx wrangler deploy
name = "mappo-link"
main = "link-resolver.js"
compatibility_date = "2025-01-01"

[vars]
# Origini autorizzate a chiamare il Worker, separate da virgola. Metti
# l'indirizzo da cui pubblichi l'app (es. "https://voboz.github.io") e,
# se provi in locale, anche "http://localhost:8080". Lascia "*" per
# consentire a chiunque usi la tua istanza.
ALLOWED_ORIGIN = "*"
